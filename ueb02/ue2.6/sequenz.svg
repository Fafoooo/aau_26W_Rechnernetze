<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1160" viewBox="0 0 1160 1160" role="img" aria-labelledby="title desc">
<title id="title">FAP/1: erfolgreiche Abhebung von 4000 Cent</title>
<desc id="desc">Benutzer, Automat, Bankzentrale und Auszahler: Authentifizierung, Kontostand, Reservierung, Beginn, einmalige Ausgabe, Bestätigung, Logout. Alle Beträge in Cent.</desc>
<!-- KI: Hermes Agent / OpenAI gpt-6.1-sol; 2026-10-19; Auftrag: Ü2.6 grafisches Sequenzdiagramm. -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#223752"/></marker></defs>
<style>text{font:16px sans-serif;fill:#14273e}.small{font-size:14px}.head{font-weight:bold}.line{stroke:#223752;stroke-width:1.8;marker-end:url(#arrow)}.reply{stroke-dasharray:6 4}.life{stroke:#8a9aad;stroke-dasharray:6 6}.note{fill:#fff3cb;stroke:#b49b4e}</style>
<rect width="1160" height="1160" fill="white"/>
<text x="30" y="30" class="head">FAP/1 — fehlerfreie Abhebung (100 EUR → 60 EUR Buchsaldo)</text>
<rect x="185" y="48" width="850" height="48" rx="6" class="note"/>
<text x="205" y="68" class="small">Entwurf: TCP + TLS 1.3, gegenseitige Zertifikatsprüfung vor AUTH.</text>
<text x="205" y="87" class="small">Referenzdemo: nur lokale Aufrufe; keine echte TLS- oder Bankverbindung.</text>
<g fill="#e5effa" stroke="#345678"><rect x="20" y="115" width="140" height="38" rx="4"/><rect x="240" y="115" width="160" height="38" rx="4"/><rect x="670" y="115" width="190" height="38" rx="4"/><rect x="985" y="115" width="150" height="38" rx="4"/></g>
<text x="42" y="140" class="head">Benutzer</text><text x="275" y="140" class="head">Automat</text><text x="690" y="140" class="head">Bankzentrale</text><text x="1010" y="140" class="head">Auszahler</text>
<path d="M90 155 V1120 M320 155 V1120 M765 155 V1120 M1060 155 V1120" class="life"/>
<path d="M90 190 H320" class="line"/><text x="100" y="181" class="small">Karte + PIN eingeben</text>
<path d="M320 230 H765" class="line"/><text x="332" y="220">AUTH {card, pin}; sid=null</text>
<text x="775" y="250" class="small">Karte/PIN prüfen</text>
<path d="M765 285 H320" class="line reply"/><text x="332" y="276">OK {sid, expires_in:300}</text>
<path d="M320 325 H765" class="line"/><text x="332" y="316">BALANCE {}</text>
<path d="M765 365 H320" class="line reply"/><text x="332" y="356" class="small">OK {booked:10000, available:10000, currency:EUR}</text>
<path d="M90 407 H320" class="line"/><text x="100" y="398" class="small">40 EUR abheben</text>
<path d="M320 447 H765" class="line"/><text x="332" y="438">RESERVE {tx:T, amount:4000}</text>
<text x="775" y="469" class="small">Deckung prüfen,</text><text x="775" y="488" class="small">4000 Cent sperren</text>
<path d="M765 525 H320" class="line reply"/><text x="332" y="516">OK {tx:T, state:RESERVED, …}</text>
<path d="M320 565 H765" class="line"/><text x="332" y="556">BEGIN {tx:T}</text>
<path d="M765 605 H320" class="line reply"/><text x="332" y="596">OK {tx:T, state:DISPENSING, …}</text>
<rect x="335" y="620" width="410" height="30" class="note"/><text x="345" y="640" class="small">Vor Ausgabe: Versuch T im Journal festhalten</text>
<path d="M320 685 H1060" class="line"/><text x="332" y="676">Einmaliger Auszahlversuch(T,4000)</text>
<path d="M1060 725 H90" class="line reply"/><text x="100" y="716">40 EUR Bargeld</text>
<path d="M1060 765 H320" class="line reply"/><text x="332" y="756">Hardwareergebnis: vollständig ausgegeben (OK)</text>
<path d="M320 805 H765" class="line"/><text x="332" y="796">RESULT {tx:T, outcome:OK}</text>
<text x="775" y="825" class="small">Einmal abbuchen,</text><text x="775" y="844" class="small">Reservierung lösen</text>
<path d="M765 885 H320" class="line reply"/><text x="332" y="876">OK {tx:T, state:COMMITTED, …}</text>
<path d="M320 925 H765" class="line"/><text x="332" y="916">BALANCE {}</text>
<path d="M765 965 H320" class="line reply"/><text x="332" y="956" class="small">OK {booked:6000, available:6000, currency:EUR}</text>
<path d="M320 1005 H765" class="line"/><text x="332" y="996">LOGOUT {}</text>
<path d="M765 1045 H320" class="line reply"/><text x="332" y="1036">OK {}</text>
<path d="M320 1085 H90" class="line reply"/><text x="100" y="1076" class="small">Karte zurück, Beleg</text>
<text x="30" y="1140" class="small">Nachrichten sind zur Lesbarkeit gekürzt: v, id, sid und vollständige Antworten siehe antwort.md; T ist dieselbe UUID.</text>
</svg>
